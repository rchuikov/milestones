name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: rootpass
          MARIADB_DATABASE: testing
          MARIADB_USER: milestones
          MARIADB_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      APP_ENV: testing
      APP_DEBUG: true
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: milestones
      DB_PASSWORD: testpass

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, curl, zip, bcmath, intl, pdo_mysql
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Prepare environment
        run: |
          cp .env.example .env
          echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: PHP tests
        run: |
          php artisan config:clear
          php artisan test

      - name: Install JS dependencies
        run: npm ci

      - name: JavaScript tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail

          ssh -o BatchMode=yes "$SSH_USER@$SSH_HOST" '
            set -e
            cd /var/www/my-milestones.app
            git fetch origin main
            git reset --hard origin/main
          '

          rsync -az --delete public/build/ \
            "$SSH_USER@$SSH_HOST:/var/www/my-milestones.app/public/build/"

          ssh -o BatchMode=yes "$SSH_USER@$SSH_HOST" '
            set -e
            cd /var/www/my-milestones.app
            composer install \
              --no-dev \
              --prefer-dist \
              --optimize-autoloader \
              --no-interaction
            composer run deploy --no-interaction
          '
